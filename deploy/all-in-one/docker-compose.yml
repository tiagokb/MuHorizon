  openmu-dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    container_name: openmu-dev
    volumes:
      - ../../src:/app/src:cached
      - nuget-cache:/root/.nuget/packages
      - build-cache:/build-cache
    working_dir: /app/src/Startup
    # build-cache volume holds obj/ and bin/ for all projects (Linux-native paths, set via
    # Directory.Build.props BaseIntermediateOutputPath/BaseOutputPath when DOTNET_RUNNING_IN_CONTAINER=true).
    # This means project.assets.json never has Windows paths and build state persists across restarts,
    # so only changed files are recompiled — first build ~10 min, subsequent restarts ~30-60 s.
    command: sh -c "dotnet restore -p:ci=true && dotnet run --no-restore --no-launch-profile -p:ci=true"
    environment:
      DB_HOST: database
      ASPNETCORE_URLS: http://+:8080
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
    ports:
      - "8081:8080"
      - "5050:5050"
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres
    container_name: database
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "openmu"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx-443:
    image: nginx:alpine
    container_name: nginx-443
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.wss.conf:/etc/nginx/nginx.conf:ro
      - ./localhost+1.pem:/etc/nginx/certs/localhost+1.pem:ro
      - ./localhost+1-key.pem:/etc/nginx/certs/localhost+1-key.pem:ro
    depends_on:
      - openmu-dev

volumes:
  dbdata:
  nuget-cache:
  build-cache:
