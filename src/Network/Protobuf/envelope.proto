syntax = "proto3";

package openmu.protocol;
option csharp_namespace = "MUnique.OpenMU.Network.Protobuf";

// ── Phase 0: Ping ─────────────────────────────────────────────────────────────

message PingRequest {
    uint64 timestamp_ms = 1;
}

message PingResponse {
    uint64 client_timestamp_ms = 1;
    uint64 server_timestamp_ms = 2;
}

// ── Phase 1: Auth ─────────────────────────────────────────────────────────────

message C2SLoginRequest {
    string username = 1;
    string password = 2;
}

enum LoginResultCode {
    UNKNOWN = 0;
    OK = 1;
    INVALID_PASSWORD = 2;
    ACCOUNT_BLOCKED = 3;
    ACCOUNT_ALREADY_CONNECTED = 4;
    CONNECTION_ERROR = 5;
    TEMPORARY_BLOCKED = 6;
}

message S2CLoginResult {
    LoginResultCode code = 1;
}

// ── Phase 1: Characters ───────────────────────────────────────────────────────

message C2SCharacterListRequest {}

message CharacterInfo {
    uint32 slot         = 1;
    string name         = 2;
    uint32 level        = 3;
    uint32 class_number = 4;
    string class_name   = 5;
}

message S2CCharacterList {
    repeated CharacterInfo characters = 1;
}

message C2SCreateCharacter {
    string name         = 1;
    uint32 class_number = 2;
}

message S2CCreateCharacterResult {
    bool          success   = 1;
    CharacterInfo character = 2;
}

message C2SSelectCharacter {
    string name = 1;
}

message S2CSelectCharacterResult {
    bool          success   = 1;
    CharacterInfo character = 2;
}

message C2SDeleteCharacter {
    string name          = 1;
    string security_code = 2;
}

message S2CDeleteCharacterResult {
    bool success = 1;
}

// ── Phase 3: Movement ────────────────────────────────────────────────────────

message C2SMove {
    float target_x = 1;
    float target_y = 2;
}

message EntitySnapshot {
    uint32 id = 1;
    float  x  = 2;
    float  y  = 3;
}

message S2CSnapshot {
    repeated EntitySnapshot entities = 1;
}

// ── Phase 2: World / AoI ──────────────────────────────────────────────────────

enum EntityType {
    PLAYER  = 0;
    NPC     = 1;
    MONSTER = 2;
}

message EntityState {
    uint32     id             = 1;
    float      x              = 2;
    float      y              = 3;
    uint32     class_number   = 4;
    string     name           = 5;
    uint32     level          = 6;
    EntityType entity_type    = 7;
    uint32     max_health     = 8;
    uint32     current_health = 9;
    uint32     move_delay_ms  = 10; // MonsterDefinition.MoveDelay; 0 for players/NPCs
    repeated EquipmentPiece equipment = 11; // players only: visible equipment (slots 0-7)
    bool       pvp_enabled    = 12; // players only: turned PvP on
    uint32     current_shield = 13; // players only (SD)
    uint32     max_shield     = 14;
    repeated ActiveEffect effects = 15; // effects shown to observers (buffs, debuffs, crowd control)
}

message ActiveEffect {
    uint32 effect_id    = 1; // MagicEffectDefinition.Number (as in S2CBuffApplied)
    uint32 remaining_ms = 2;
}

// One visible equipped item. Only what the renderer needs — stats travel in ItemData.
message EquipmentPiece {
    uint32 slot      = 1; // 0=right-hand weapon, 1=left hand, 2=helm, 3=armor, 4=pants, 5=gloves, 6=boots, 7=wings
    uint32 group     = 2; // ItemDefinition.Group
    uint32 number    = 3; // ItemDefinition.Number
    uint32 level     = 4;
    bool   excellent = 5;
    bool   ancient   = 6;
}

// Full visible-equipment snapshot of a player, sent to observers when it changes.
message S2CAppearanceChanged {
    uint32                  entity_id = 1;
    repeated EquipmentPiece equipment = 2;
}

message S2CEnteredWorld {
    uint32     map_id   = 1;
    float      x        = 2;
    float      y        = 3;
    uint32     own_id   = 4;
    PvpMapMode pvp_mode = 5;
}

// GameMapDefinition.PvpMode: whether players can fight each other on the map.
enum PvpMapMode {
    PVP_MAP_MODE_FLAGGED  = 0; // players with PvP on fight each other
    PVP_MAP_MODE_DISABLED = 1; // PvE only (towns)
    PVP_MAP_MODE_ENABLED  = 2; // everyone fights; PvP can't be turned off
}

message S2CEntitiesInScope {
    repeated EntityState entities = 1;
}

message S2CEntitiesOutOfScope {
    repeated uint32 entity_ids = 1;
}

// ── Phase 4: Skills ───────────────────────────────────────────────────────────

message C2SCastSkill {
    uint32 skill_id  = 1;
    uint32 target_id = 2;
    // Area and directional skills aim at a ground point instead of an entity.
    bool   has_target_position = 3;
    float  target_x            = 4; // server units (1 tile = 8)
    float  target_y            = 5;
}

message S2CSkillAnimation {
    uint32 attacker_id    = 1;
    uint32 target_id      = 2;
    uint32 skill_id       = 3;
    bool   effect_applied = 4;
}

// An area or directional skill cast at a ground point (Flame, Evil Spirit, Aqua Beam...).
// Hits on each target arrive separately as S2CDamageResult.
message S2CAreaSkillAnimation {
    uint32 attacker_id = 1;
    uint32 skill_id    = 2;
    float  target_x    = 3; // server units, tile center
    float  target_y    = 4;
}

// The own player is moving to another map (warp, gate) or another spot of the same map:
// the client clears the entities, loads the map and answers with C2SMapLoaded.
message S2CMapChanged {
    uint32 map_id = 1;
    float  x      = 2; // server units, tile center
    float  y      = 3;
}

message WarpEntry {
    uint32 index             = 1;
    string name              = 2;
    uint32 cost              = 3; // zen
    uint32 level_requirement = 4; // already adjusted for the character's class
    uint32 map_id            = 5;
}

message S2CWarpList {
    repeated WarpEntry entries = 1;
}

// The chaos machine's items (storage 3) and what mixing them would do; sent when it opens and
// after every change. mix_name is empty when the items fit no recipe.
message S2CChaosMachine {
    repeated ItemData items        = 1;
    string            mix_name     = 2;
    uint32            success_rate = 3; // percent
    uint32            price        = 4; // zen
    bool              opened       = 5; // true when the player just opened it (talked to the goblin)
}

enum QuestStatus {
    QUEST_STATUS_AVAILABLE = 0; // can be started now
    QUEST_STATUS_ACTIVE    = 1;
    QUEST_STATUS_COMPLETED = 2;
    QUEST_STATUS_LOCKED    = 3; // needs a higher level or the previous quest first
}

message QuestRequirement {
    string text     = 1; // e.g. "Scroll of Emperor" or "Kill Balram"
    uint32 current  = 2; // items in the inventory / monsters killed
    uint32 required = 3;
}

message QuestInfo {
    uint32                    group             = 1;
    uint32                    number            = 2;
    string                    name              = 3;
    QuestStatus               status            = 4;
    uint32                    minimum_level     = 5;
    uint32                    start_cost        = 6; // zen
    repeated QuestRequirement requirements      = 7;
    repeated string           rewards           = 8;
    bool                      can_complete      = 9; // active and every requirement met
}

// The quests of the opened quest NPC for the own character; resent after every quest action.
message S2CQuestDialog {
    uint32             npc_id   = 1;
    string             npc_name = 2;
    repeated QuestInfo quests   = 3;
}

// A player (or the own one) turned PvP on or off.
message S2CPvpChanged {
    uint32 entity_id = 1;
    bool   enabled   = 2;
}

// Health and shield of another player (the bar above its head); sent when they change.
message S2CEntityVitals {
    uint32 entity_id      = 1;
    uint32 current_health = 2;
    uint32 max_health     = 3;
    uint32 current_shield = 4;
    uint32 max_shield     = 5;
}

message S2CChatMessage {
    string sender = 1;
    string text   = 2;
    string type   = 3; // ChatMessageType: Normal, Whisper, Party, Guild...
}

// The opened NPC window was closed by the server (e.g. the player walked away): the client hides it.
message S2CNpcDialogClosed {}

// The character left the game (C2SLogout); for LOGIN_SCREEN the connection is closed next.
message S2CLogout {
    LogoutKind kind = 1;
}

// A message for the player, e.g. why a warp was refused.
message S2CSystemMessage {
    string text = 1;
}

// A player in scope (or the own player) started charging or casting a skill.
message S2CCastStarted {
    uint32   caster_id   = 1;
    uint32   skill_id    = 2;
    CastType cast_type   = 3;
    uint32   duration_ms = 4; // cast time, or time to full charge
    uint32   hold_ms     = 5; // CHARGE: a full charge is held this long, then released automatically
}

message S2CCastEnded {
    uint32 caster_id = 1;
    uint32 skill_id  = 2;
    bool   completed = 3; // false: cancelled or interrupted
}

// Sent when a skill goes on cooldown (cast accepted: full cooldown) and when a cast is
// rejected because the skill is still cooling down (remaining time), so the client's
// cooldown always follows the server's.
message S2CSkillCooldown {
    uint32 skill_id     = 1;
    uint32 remaining_ms = 2;
}

message S2CDamageResult {
    uint32 target_id        = 1;
    uint32 health_damage    = 2;
    uint32 shield_damage    = 3;
    uint32 attributes       = 4;
    uint32 remaining_health = 5;
}

message S2CBuffApplied {
    uint32 target_id   = 1;
    uint32 effect_id   = 2;
    uint32 duration_ms = 3;
}

message S2CBuffExpired {
    uint32 target_id = 1;
    uint32 effect_id = 2;
}

// ── Phase 5: Death & Drops ────────────────────────────────────────────────────

message S2CEntityDied {
    uint32 entity_id = 1;
    uint32 killer_id = 2;
}

message S2CItemDropped {
    uint32 drop_id     = 1;
    float  x           = 2;
    float  y           = 3;
    uint32 item_number = 4;
    uint32 item_group  = 5;
    bool   is_money    = 6;
    uint32 amount      = 7;
}

message C2SPickUpItem {
    uint32 drop_id = 1;
}

message C2SMoveItem {
    uint32 from_slot    = 1;
    uint32 to_slot      = 2;
    uint32 from_storage = 3;  // 0=Inventory (default), 2=Vault
    uint32 to_storage   = 4;  // 0=Inventory (default), 2=Vault
}

enum StatType {
    STAT_STRENGTH   = 0;
    STAT_AGILITY    = 1;
    STAT_VITALITY   = 2;
    STAT_ENERGY     = 3;
    STAT_LEADERSHIP = 4;
}

message C2SAddStatPoint {
    StatType stat = 1;
}

message S2CPickUpResult {
    bool   success = 1;
    uint32 drop_id = 2;
}

// ── Phase 6: Projectiles ─────────────────────────────────────────────────────

message S2CProjectileSpawned {
    uint32 projectile_id = 1;
    uint32 owner_id      = 2;
    uint32 skill_id      = 3;
    float  origin_x      = 4;
    float  origin_y      = 5;
    float  velocity_x    = 6;
    float  velocity_y    = 7;
}

message S2CProjectileHit {
    uint32 projectile_id = 1;
    uint32 target_id     = 2;
}

message S2CProjectileExpired {
    uint32 projectile_id = 1;
}

// ── Phase 10: Character State ─────────────────────────────────────────────────

message S2CCharacterState {
    uint32 level            = 1;
    uint32 level_up_points  = 2;
    uint32 current_hp       = 3;
    uint32 max_hp           = 4;
    uint32 current_mp       = 5;
    uint32 max_mp           = 6;
    uint32 current_sd       = 7;
    uint32 max_sd           = 8;
    uint32 current_ag       = 9;
    uint32 max_ag           = 10;
    uint64 experience       = 11;
    uint64 experience_next  = 12;
    uint32 money            = 13;
    uint32 strength         = 14;
    uint32 agility          = 15;
    uint32 vitality         = 16;
    uint32 energy           = 17;
    uint32 leadership       = 18;
    uint32 attack_speed     = 19; // total computed attack speed (agility/class formula + weapon)
    uint32 magic_speed      = 20; // total computed magic speed (agility/class formula + weapon)
    uint32 min_phys_dmg     = 21; // minimum physical base damage
    uint32 max_phys_dmg     = 22; // maximum physical base damage
    uint32 min_wiz_dmg      = 23; // minimum wizardry base damage
    uint32 max_wiz_dmg      = 24; // maximum wizardry base damage
    uint32 class_number     = 25; // CharacterClass.Number — changes with quests (e.g. Dark Knight -> Blade Knight)
    string class_name       = 26;
}

message S2CVitalsUpdate {
    uint32 current_hp = 1;
    uint32 max_hp     = 2;
    uint32 current_mp = 3;
    uint32 max_mp     = 4;
    uint32 current_sd = 5;
    uint32 max_sd     = 6;
    uint32 current_ag = 7;
    uint32 max_ag     = 8;
}

message S2CExperienceGained {
    uint32 gained     = 1;
    uint64 total      = 2;
    uint64 next_level = 3;
    uint32 killed_id  = 4;
    bool   is_master  = 5;
}

message S2CLevelUp {
    uint32 level           = 1;
    uint32 level_up_points = 2;
    uint32 max_hp          = 3;
    uint32 max_mp          = 4;
    uint32 max_sd          = 5;
    uint32 max_ag          = 6;
}

// ── Phase 11: Inventory ───────────────────────────────────────────────────────

message ItemData {
    uint32 slot          = 1;  // 0-11 equipment, 12+ bag (top-left corner)
    uint32 number        = 2;  // ItemDefinition.Number
    uint32 group         = 3;  // ItemDefinition.Group (0=Swords…14=Rings)
    uint32 level         = 4;
    bool   has_skill     = 5;
    bool   has_luck      = 6;
    bool   has_option    = 7;  // additional option (+4/+8/+12 dmg or def)
    bool   has_excellent = 8;
    bool   has_ancient   = 9;
    uint32 width         = 10; // ItemDefinition.Width  (cells)
    uint32 height        = 11; // ItemDefinition.Height (cells)
    uint32 durability    = 12; // current stack count (stackable) or durability (wearable)
    uint32 option_level  = 13; // 0=none, 1=+4, 2=+8, 3=+12 (ItemOptionTypes.Option level)
    uint32 min_dmg       = 14; // min physical damage at current item level (0 for non-weapons)
    uint32 max_dmg       = 15; // max physical damage at current item level (0 for non-weapons)
    uint32 defense       = 16; // defense at current item level (0 for non-armor/shield)
    uint32 defense_rate  = 17; // shield block rate at current item level (0 for non-shields)
    uint32 wizardry_rise = 18; // wizardry/pet-atk rise % at current item level (staffs/books/scepters)
}

message S2CInventory {
    repeated ItemData items = 1;
}

message S2CItemAppeared {
    ItemData item = 1;
}

message S2CItemRemoved {
    uint32 slot = 1;
}

message S2CMoneyUpdate {
    uint32 money = 1;
}

// ── Phase 12: Item Definitions ───────────────────────────────────────────────

message ItemDefinitionData {
    uint32 group                        = 1;
    uint32 number                       = 2;
    string name                         = 3;
    uint32 width                        = 4;
    uint32 height                       = 5;
    uint32 drop_level                   = 6;
    repeated uint32 qualified_class_numbers = 7;  // CharacterClass.Number values
    repeated uint32 equip_slots         = 8;      // ItemSlotType.ItemSlots indices (0-11)
    uint32 req_strength                 = 9;
    uint32 req_agility                  = 10;
    uint32 req_energy                   = 11;
    uint32 req_vitality                 = 12;
    uint32 req_leadership               = 13;
    bool   is_stackable                 = 14; // true for potions, jewels, etc.
    bool   is_consumable                = 15; // true for items that can be right-clicked to use
    uint32 attack_speed                 = 16; // attack speed bonus from weapon (0 for non-weapons)
}

message S2CItemDefinitions {
    repeated ItemDefinitionData items = 1;
}

// ── Phase 15: Vault ───────────────────────────────────────────────────────────

message S2CVaultOpened {
    repeated ItemData items       = 1;
    uint32            money       = 2;
    bool              is_extended = 3;
}

message C2SCloseVault {}

// ── Phase 14: Skill List ─────────────────────────────────────────────────────

message SkillData {
    uint32 slot   = 1;  // ordinal in the list (0-N)
    uint32 number = 2;  // Skill.Number
    uint32 level  = 3;  // master skill level (0 for normal skills)
    uint32 range  = 4;  // Skill.Range in tiles — the server validates casts against it (+2 tiles tolerance)
    // The area the skill hits, derived from its AreaSkillSettings, so the client's preview
    // shows exactly what the server will hit. NONE for single-target skills.
    SkillArea area_shape  = 5;
    float     area_radius = 6;  // tiles: circle radius, or cone length for CONE
    float     area_width  = 7;  // tiles: cone width at its far end (CONE only)
    uint32    cooldown_ms = 8;  // Skill.CooldownMilliseconds; 0 = only paced by attack speed
    CastType  cast_type    = 9;
    uint32    cast_time_ms = 10; // CHARGE: time to full charge; CAST_TIME: time to complete
}

// How a skill is cast (Skill.CastType).
enum CastType {
    CAST_TYPE_INSTANT   = 0;
    CAST_TYPE_CHARGE    = 1; // hold the key to charge (C2SCastControl START_CHARGE), release it to fire (RELEASE)
    CAST_TYPE_CAST_TIME = 2; // cast normally (C2SCastSkill); it takes effect after cast_time_ms
}

enum SkillArea {
    SKILL_AREA_NONE   = 0;
    SKILL_AREA_CIRCLE = 1; // around the aimed ground point
    SKILL_AREA_CONE   = 2; // from the caster towards the aimed point
}

message S2CSkillList {
    repeated SkillData skills = 1;
}

// ── Phase 13: NPC Interaction ─────────────────────────────────────────────────

message C2SInteractNpc {
    uint32 npc_id = 1;
}

message C2SBuyNpcItem {
    uint32 slot = 1;
}

message C2SCloseShop {}

message ShopItem {
    uint32 slot         = 1;
    uint32 number       = 2;
    uint32 group        = 3;
    uint64 price        = 4;
    uint32 level        = 5;
    bool   has_skill    = 6;
    bool   has_luck     = 7;
    bool   has_option   = 8;
    uint32 width        = 9;
    uint32 height       = 10;
    bool   has_excellent = 11;
    bool   has_ancient   = 12;
}

// ── Phase 16: Sell to NPC ─────────────────────────────────────────────────────

// ── Phase 17: Item Use ────────────────────────────────────────────────────────

message C2SUseItem {
    uint32 slot            = 1;
    uint32 target_slot     = 2; // the item a jewel is applied to (has_target_slot)
    bool   has_target_slot = 3; // slot 0 is the left hand, so "no target" needs its own flag
}

message C2STeleport {
    uint32 target_x = 1;  // tile column
    uint32 target_y = 2;  // tile row
}

enum CastAction {
    CAST_ACTION_START_CHARGE = 0;
    CAST_ACTION_RELEASE      = 1; // releases the charge
    CAST_ACTION_CANCEL       = 2; // cancels the charge or cast; the skill still goes on cooldown
}

// The client finished loading the map of S2CMapChanged; the server then places the player
// on it and answers with S2CEnteredWorld and the entities in scope.
message C2SMapLoaded {}

message C2SGetWarpList {}

enum LogoutKind {
    LOGOUT_KIND_CHARACTER_SELECT = 0; // back to the character selection, still logged in
    LOGOUT_KIND_LOGIN_SCREEN     = 1; // log out: the server disconnects
}

enum QuestActionKind {
    QUEST_ACTION_KIND_START    = 0; // pays the start cost, then the quest items start dropping
    QUEST_ACTION_KIND_COMPLETE = 1; // hands in the required items/kills and gets the rewards
    QUEST_ACTION_KIND_CANCEL   = 2;
}

// A quest of the opened quest NPC (S2CQuestDialog).
message C2SQuestAction {
    QuestActionKind action = 1;
    uint32          group  = 2;
    uint32          number = 3;
}

// Turns the own PvP on or off; turning it off needs 30 s without PvP combat.
message C2SSetPvp {
    bool enabled = 1;
}

// A chat line typed by the player; lines starting with '/' are chat commands (e.g. /dummy stun).
message C2SChatMessage {
    string text = 1;
}

// Chaos Goblin: the server finds the recipe the items in the machine fit (S2CChaosMachine) and mixes them.
message C2SChaosMix {}

// Closes the opened NPC window; the chaos machine returns its items to the inventory first.
message C2SCloseNpcDialog {}

message C2SLogout {
    LogoutKind kind = 1;
}

// Warps to a destination of S2CWarpList (level and zen requirements are checked by the server).
message C2SWarp {
    uint32 index = 1; // WarpEntry.index
}

message C2SCastControl {
    CastAction action   = 1;
    uint32     skill_id = 2; // START_CHARGE only
}

// Own player's effective movement speed — sent on world entry, on changes of speed-related
// attributes (wings, boots, mounts, slow effects) and on safezone transitions.
message S2CMovementSpeed {
    float movement_speed = 1; // legacy MU units: 15 = base run, 16-19 = fast wings/mounts
    float tiles_per_sec  = 2; // what GameTickLoop actually moves the character by
}

// Own player's minimum interval between attacks and skill casts, as enforced by the server's
// speed-hack check. Sent on world entry and whenever attack speed changes.
// The own player's basic attack: pacing, and range and weapon (resent when the weapon changes).
message S2CAttackInterval {
    uint32       min_interval_ms = 1; // 0 = unknown
    uint32       attack_range    = 2; // tiles
    AttackWeapon weapon          = 3;
}

enum AttackWeapon {
    ATTACK_WEAPON_MELEE    = 0;
    ATTACK_WEAPON_SPEAR    = 1;
    ATTACK_WEAPON_BOW      = 2;
    ATTACK_WEAPON_CROSSBOW = 3;
}

message S2CSafezoneChanged {
    bool in_safezone = 1;  // true = player entered a safe zone; false = left safe zone
}

message C2SDropItem {
    uint32 slot = 1;  // inventory slot to drop (12+ for bag items)
}

message C2SSellNpcItem {
    uint32 slot      = 1;
    bool   confirmed = 2;  // true = player confirmed sell of valuable item
}

message S2CSellConfirmRequired {
    uint32 slot       = 1;
    string item_name  = 2;
    uint64 sell_price = 3;
}

message SellPriceEntry {
    uint32 slot  = 1;
    uint64 price = 2;
}

message S2CSellPriceList {
    repeated SellPriceEntry entries = 1;
}

message S2CShopItems {
    uint32            npc_id   = 1;
    string            npc_name = 2;
    repeated ShopItem items    = 3;
}

// ── Envelopes ─────────────────────────────────────────────────────────────────

message ClientEnvelope {
    oneof payload {
        PingRequest             ping_request           = 1;
        C2SLoginRequest         login_request          = 2;
        C2SCharacterListRequest character_list_request = 3;
        C2SCreateCharacter      create_character       = 4;
        C2SSelectCharacter      select_character       = 5;
        C2SDeleteCharacter      delete_character       = 6;
        C2SMove                 move                   = 7;
        C2SCastSkill            cast_skill             = 8;
        C2SPickUpItem           pick_up_item           = 9;
        C2SMoveItem             move_item              = 10;
        C2SAddStatPoint         add_stat_point         = 11;
        C2SInteractNpc          interact_npc           = 12;
        C2SBuyNpcItem           buy_npc_item           = 13;
        C2SCloseShop            close_shop             = 14;
        C2SCloseVault           close_vault            = 15;
        C2SSellNpcItem          sell_npc_item          = 16;
        C2SUseItem              use_item               = 17;
        C2SDropItem             drop_item              = 18;
        C2STeleport             teleport               = 19;
        C2SCastControl          cast_control           = 20;
        C2SMapLoaded            map_loaded             = 21;
        C2SGetWarpList          get_warp_list          = 22;
        C2SWarp                 warp                   = 23;
        C2SLogout               logout                 = 24;
        C2SChaosMix             chaos_mix              = 25;
        C2SCloseNpcDialog       close_npc_dialog       = 26;
        C2SQuestAction          quest_action           = 27;
        C2SChatMessage          chat_message           = 28;
        C2SSetPvp               set_pvp                = 29;
    }
}

message ServerEnvelope {
    oneof payload {
        PingResponse             ping_response           = 1;
        S2CLoginResult           login_result            = 2;
        S2CCharacterList         character_list          = 3;
        S2CCreateCharacterResult create_character_result = 4;
        S2CSelectCharacterResult select_character_result = 5;
        S2CDeleteCharacterResult delete_character_result = 6;
        S2CEnteredWorld          entered_world           = 7;
        S2CEntitiesInScope       entities_in_scope       = 8;
        S2CEntitiesOutOfScope    entities_out_of_scope   = 9;
        S2CSnapshot              snapshot                = 10;
        S2CSkillAnimation        skill_animation         = 11;
        S2CDamageResult          damage_result           = 12;
        S2CBuffApplied           buff_applied            = 13;
        S2CBuffExpired           buff_expired            = 14;
        S2CEntityDied            entity_died             = 15;
